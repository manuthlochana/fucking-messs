<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KALA-BALANA{% endblock %} — Hardware Intelligence Engine</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full flex flex-col font-sans antialiased selection:bg-emerald-500 selection:text-white">
    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-4">
                    <a href="/" class="flex items-center space-x-3">
                        <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center font-black text-slate-950 text-lg shadow-lg shadow-emerald-500/20">
                            KB
                        </div>
                        <div>
                            <span class="font-extrabold text-lg tracking-tight text-white">KALA-BALANA</span>
                            <span class="text-[10px] block uppercase tracking-widest text-emerald-400 font-mono -mt-1">Hardware Intel</span>
                        </div>
                    </a>
                    <div class="hidden md:flex items-center space-x-1 pl-6">
                        <a href="/" class="px-3 py-1.5 rounded-md text-sm font-medium {% if active_page == 'overview' %}bg-slate-800 text-emerald-400 font-semibold{% else %}text-slate-300 hover:text-white hover:bg-slate-800/60{% endif %}">Overview</a>
                        <a href="/catalog" class="px-3 py-1.5 rounded-md text-sm font-medium {% if active_page == 'catalog' %}bg-slate-800 text-emerald-400 font-semibold{% else %}text-slate-300 hover:text-white hover:bg-slate-800/60{% endif %}">Master Catalog</a>
                        <a href="/queue" class="px-3 py-1.5 rounded-md text-sm font-medium {% if active_page == 'queue' %}bg-slate-800 text-emerald-400 font-semibold{% else %}text-slate-300 hover:text-white hover:bg-slate-800/60{% endif %}">Forensic Queue</a>
                        <a href="/ingest" class="px-3 py-1.5 rounded-md text-sm font-medium {% if active_page == 'ingest' %}bg-slate-800 text-emerald-400 font-semibold{% else %}text-slate-300 hover:text-white hover:bg-slate-800/60{% endif %}">Ingestion Manager</a>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="flex items-center space-x-2 text-xs font-mono px-3 py-1.5 rounded-full bg-slate-800/80 border border-slate-700/80">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span class="text-slate-300">Engine Online</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-900/40 text-slate-500 text-xs py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <span>KALA-BALANA v2.0 • Autonomous 24/7 Hardware Intelligence Engine</span>
            <span>Sri Lanka Market Baseline (LKR)</span>
        </div>
    </footer>
</body>
</html>
