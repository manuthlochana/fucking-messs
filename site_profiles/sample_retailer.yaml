# Example domain-specific site profile for KALA-BALANA ingestion.
#
# This is a realistic template for a Sri Lankan electronics retailer running a
# typical WooCommerce storefront. Copy this file, rename it, and adjust the
# `domains` list and selectors for each retailer you want first-class support
# for. Selectors here OVERRIDE the generic profile for matching domains.

name: sample_retailer
domains:
  - sampleretailer.lk
  - shop.sampleretailer.lk
selector_type: css

selectors:
  title: "h1.product_title.entry-title"
  # WooCommerce renders the sale price inside <ins>; regular price inside <del>.
  price: "p.price ins .woocommerce-Price-amount, p.price > .woocommerce-Price-amount"
  original_price: "p.price del .woocommerce-Price-amount"
  stock_button: "button.single_add_to_cart_button"
  stock_text: "p.stock, .availability"
  specs_table: "table.woocommerce-product-attributes"
  # This retailer shows local-bank card offers in a dedicated banner.
  card_promo: ".bank-promo-banner, .koko-widget, .mintpay-widget"
  pagination: "nav.woocommerce-pagination a.next"

currency: LKR
prefer_jsonld_availability: true
# WooCommerce price block is server-rendered, so a short settle is enough.
wait_for: "p.price"
# Known BNPL widgets this retailer embeds — hints the Track A extractor.
bnpl_widgets:
  - koko
  - mintpay
notes: >
  Template profile. Not a real store — replace `domains` and selectors with a
  concrete retailer's markup before relying on it in production.
